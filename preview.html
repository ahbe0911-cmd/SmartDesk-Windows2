<!doctype html><html lang="fa" dir="rtl"><head><meta charset="utf-8"><style>
*{box-sizing:border-box}html,body{margin:0;width:100%;height:100%;overflow:hidden}body{padding:18px;background:radial-gradient(circle at 15% 0,#315346,#07130f 45%);color:#fff;font-family:"Vazirmatn","Segoe UI",Tahoma,sans-serif}.top,.card{background:#10251fdd;border:1px solid #ffffff1c;border-radius:20px;box-shadow:0 18px 45px #0005}.top{height:66px;padding:13px 20px;font-size:21px;font-weight:bold}.top small{display:block;color:#9fb5aa;font-size:11px;margin-top:5px}.grid{height:calc(100% - 82px);margin-top:16px;display:grid;grid-template-columns:29% 42% 29%;gap:16px}.card{padding:18px;overflow:hidden}.links{display:grid;grid-template-columns:1fr 1fr;gap:10px}.link{height:84px;border:0;border-radius:15px;color:#fff;background:linear-gradient(145deg,#116147,#15946b);font-family:inherit}.link:nth-child(even){background:linear-gradient(145deg,#29457b,#376bc5)}input{width:100%;padding:10px;margin:6px 0;border:0;border-radius:10px}.save{width:100%;height:42px;border:0;border-radius:10px;background:#10b981;color:white}.calendar{background:#f6f8f7;color:#17231d}.calhead{display:flex;justify-content:space-between;align-items:center}.calgrid{display:grid;grid-template-columns:repeat(7,1fr);grid-template-rows:repeat(6,1fr);gap:6px;height:calc(100% - 55px);text-align:center}.calgrid>*{display:grid;place-items:center;border-radius:10px}.weekday{color:#718078}.today{background:#10b981!important;color:#fff}.friday{color:#d84c4c}.left{text-align:center}.clock{font-size:56px;font-weight:bold;direction:ltr}.date{color:#bdd0c6;margin-top:8px}.analog{width:180px;height:180px;border:5px solid #ffffff18;border-radius:50%;margin:20px auto;position:relative;background:radial-gradient(circle,#173b2d,#081711)}.analog:before{content:"12";position:absolute;top:8px;left:50%;transform:translateX(-50%)}.analog:after{content:"6";position:absolute;bottom:8px;left:50%;transform:translateX(-50%)}.hand{position:absolute;left:50%;bottom:50%;transform-origin:50% 100%;border-radius:5px}.hour{width:4px;h
